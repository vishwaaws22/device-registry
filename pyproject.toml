[project]
name = "device-registry"
version = "0.2.0"
description = "Central server for scanner devices: registration and monitoring (training capstone)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
